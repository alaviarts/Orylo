<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Traceable Delivery</title>
  <desc id="desc">Definition, decision, execution, validation and outcome remain connected by traceability and evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#151b23"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="250" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="248" rx="25" fill="none" stroke="#30363d"/>

  <g stroke="#48515c" stroke-width="2">
    <line x1="210" y1="105" x2="350" y2="105"/>
    <line x1="450" y1="105" x2="590" y2="105"/>
    <line x1="690" y1="105" x2="830" y2="105"/>
    <line x1="930" y1="105" x2="1030" y2="105"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">
    <rect x="70" y="76" width="140" height="58" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="140" y="112" text-anchor="middle">DEFINE</text>

    <rect x="350" y="76" width="100" height="58" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="400" y="112" text-anchor="middle">DECIDE</text>

    <rect x="590" y="76" width="100" height="58" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="640" y="112" text-anchor="middle">EXECUTE</text>

    <rect x="830" y="76" width="100" height="58" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="880" y="112" text-anchor="middle">VALIDATE</text>

    <rect x="1030" y="76" width="100" height="58" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="1080" y="112" text-anchor="middle">DELIVER</text>
  </g>

  <line x1="140" y1="178" x2="1080" y2="178" stroke="#40566d" stroke-width="2"/>
  <circle cx="140" cy="178" r="4" fill="#8aa9c3"/>
  <circle cx="1080" cy="178" r="4" fill="#8aa9c3"/>
  <text x="610" y="208" text-anchor="middle" fill="#9aa7b3"
        font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="1">
    TRACEABILITY · EVIDENCE
  </text>
</svg>