    <radialGradient id="glow" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#2f6f9f" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#2f6f9f" stop-opacity="0"/>
