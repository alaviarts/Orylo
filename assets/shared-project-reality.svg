<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Shared Project Reality</title>
  <desc id="desc">Humans and AI contributors align around one shared project reality that supports coherent delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#151b23"/>
    </linearGradient>
    <radialGradient id="glow" cx="52%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#2f6f9f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2f6f9f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="250" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="250" rx="26" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="248" rx="25" fill="none" stroke="#30363d"/>

  <g stroke="#48515c" stroke-width="2">
    <line x1="330" y1="125" x2="470" y2="125"/>
    <line x1="730" y1="125" x2="870" y2="125"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="95" y="87" width="235" height="76" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="212.5" y="120" text-anchor="middle" fill="#f0f6fc" font-size="24" font-weight="700">HUMANS + AI</text>
    <text x="212.5" y="145" text-anchor="middle" fill="#8b949e" font-size="16" font-weight="500">contributors</text>

    <rect x="470" y="66" width="260" height="118" rx="28" fill="#18222d" stroke="#40566d"/>
    <text x="600" y="112" text-anchor="middle" fill="#f0f6fc" font-size="28" font-weight="700">PROJECT REALITY</text>
    <text x="600" y="145" text-anchor="middle" fill="#a9b4c0" font-size="17" font-weight="500">Knowledge · Decisions · State</text>

    <rect x="870" y="87" width="235" height="76" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="987.5" y="120" text-anchor="middle" fill="#f0f6fc" font-size="24" font-weight="700">DELIVERY</text>
    <text x="987.5" y="145" text-anchor="middle" fill="#8b949e" font-size="16" font-weight="500">coherent &amp; controlled</text>
  </g>
</svg>